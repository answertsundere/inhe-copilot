server {
    listen 80;
    server_name www.inhe.ccwu.cc;

    # 强制 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.inhe.ccwu.cc;

    # SSL 证书（请替换为实际路径）
    ssl_certificate     /etc/nginx/ssl/inhe.ccwu.cc.pem;
    ssl_certificate_key /etc/nginx/ssl/inhe.ccwu.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 客户端上传大小限制（Excel 导入）
    client_max_body_size 50m;

    # 静态文件直接由 Nginx 服务（更快）
    # 注意：请把后端端口换成实际运行端口（如 5011 / 5010）
    location /kb-admin/assets/ {
        proxy_pass http://127.0.0.1:5011;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 所有请求代理到 Flask
    # /ask/real-test、/ask/training-samples、/ask/kb-admin/ 均由 Flask 处理
    location / {
        proxy_pass http://127.0.0.1:5011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（AI 生成可能较慢）
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 缓冲（SSE/流式回复需要关闭）
        proxy_buffering on;
        proxy_buffer_size 4k;
    }
}
