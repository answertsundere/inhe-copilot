<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设置 - INHE Copilot</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d8dee9;--primary:#2563eb;--primary2:#1d4ed8;--red:#dc2626;--green:#059669;--orange:#d97706;--radius:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;padding:56px 18px 24px}
.gnav{position:fixed;top:0;left:0;right:0;height:42px;background:#111827;color:#fff;display:flex;align-items:center;gap:6px;padding:0 14px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.gnav strong{font-size:12px;letter-spacing:.5px;margin-right:8px;color:#cbd5e1}
.gnav a{color:#d1d5db;text-decoration:none;padding:7px 12px;border-radius:6px;font-size:13px}
.gnav a:hover,.gnav a.active{background:#263244;color:#fff}
.wrap{max-width:980px;margin:0 auto}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:22px}
.sub{margin-top:4px;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h2{font-size:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;color:#374151;font-weight:600;font-size:13px;margin-bottom:6px}
input{width:100%;height:38px;border:1px solid var(--border);border-radius:6px;padding:0 10px;font-size:14px;background:#fff}
input:focus{outline:2px solid rgba(37,99,235,.18);border-color:var(--primary)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{height:36px;border:0;border-radius:6px;padding:0 15px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--primary2)}
.btn.secondary{background:#475569}
.btn.danger{background:var(--red)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.kv{display:grid;grid-template-columns:150px 1fr;gap:12px;border-bottom:1px solid #edf1f7;padding:9px 0}
.kv:last-child{border-bottom:0}
.k{color:var(--muted)}
.v{font-weight:600;word-break:break-all}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px}
.ok{background:#dcfce7;color:#166534}
.warn{background:#fef3c7;color:#92400e}
.result{display:none;margin-top:12px;border:1px solid var(--border);background:#f8fafc;border-radius:6px;padding:12px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;max-height:260px;overflow:auto}
.result.success{border-color:#86efac;background:#f0fdf4;color:#14532d}
.result.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}
.notice{border:1px solid #bfdbfe;background:#eff6ff;border-radius:6px;padding:10px 12px;color:#1e3a8a;font-size:13px;margin-bottom:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.page-title{display:block}}
</style>
</head>
<body>
<nav class="gnav">
  <strong>INHE</strong>
  <a href="/ask/real-test">智能回复建议区</a>
  <a href="/ask/kb-admin/">资料库</a>
  <a href="/ask/settings" class="active">系统设置</a>
</nav>

<main class="wrap">
  <div class="page-title">
    <div>
      <h1>系统设置</h1>
      <div class="sub">配置智能回复使用的 LLM API。密钥只会脱敏显示，不会回传明文。</div>
    </div>
    <button class="btn secondary" onclick="loadLlmConfig()">刷新状态</button>
  </div>

  <section class="card">
    <h2>LLM 运行状态</h2>
    <div id="llmStatusArea">加载中...</div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="testBtn" onclick="testLlmConnection()">测试连接</button>
      <button class="btn secondary" onclick="loadLlmConfig()">刷新</button>
    </div>
    <div id="testResult" class="result"></div>
  </section>

  <section class="card">
    <h2>配置 API Key</h2>
    <div class="notice">
      留空 API Key 时只更新模型和 API Base，不会覆盖已有 Key。需要删除 Key 时请使用“清空 API Key”。
    </div>
    <div class="grid">
      <div>
        <label for="apiBase">API Base</label>
        <input id="apiBase" placeholder="https://api.deepseek.com">
      </div>
      <div>
        <label for="model">模型名称</label>
        <input id="model" placeholder="deepseek-chat">
      </div>
      <div style="grid-column:1/-1">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" autocomplete="new-password" placeholder="粘贴新的 API Key；留空则保留当前 Key">
        <div class="hint">保存后会写入服务器本机 .env，并尝试立即刷新运行时配置。</div>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="saveBtn" onclick="saveLlmConfig(false)">保存配置</button>
      <button class="btn danger" id="clearBtn" onclick="clearApiKey()">清空 API Key</button>
    </div>
    <div id="saveResult" class="result"></div>
  </section>

  <section class="card">
    <h2>说明</h2>
    <div class="kv"><div class="k">权限</div><div class="v">只有管理员或主管角色可以保存配置。</div></div>
    <div class="kv"><div class="k">安全</div><div class="v">接口不会返回明文 API Key；页面刷新后只能看到脱敏值。</div></div>
    <div class="kv"><div class="k">生效方式</div><div class="v">保存后会立即更新当前进程配置；如果连接测试仍使用旧配置，再重启服务。</div></div>
  </section>
</main>

<script>
function apiPath(path){
  return location.pathname.startsWith('/ask/') ? '/ask' + path : path
}
function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
function roleHeaders(){
  return {
    'Content-Type':'application/json',
    'X-User-Role': localStorage.getItem('kb_user_role') || 'supervisor',
    'X-User-Name': localStorage.getItem('kb_user_name') || 'admin'
  }
}
function showResult(id, ok, text){
  const el=document.getElementById(id)
  el.style.display='block'
  el.className='result ' + (ok ? 'success' : 'error')
  el.textContent=text
}
function renderConfig(d){
  const badge=d.configured
    ? '<span class="badge ok">AI 模式</span>'
    : '<span class="badge warn">零配置模式</span>'
  document.getElementById('llmStatusArea').innerHTML =
    '<div style="margin-bottom:10px">'+badge+'</div>' +
    '<div class="kv"><div class="k">API Key</div><div class="v">'+esc(d.api_key_masked || '未配置')+'</div></div>' +
    '<div class="kv"><div class="k">模型</div><div class="v">'+esc(d.model || '')+'</div></div>' +
    '<div class="kv"><div class="k">API Base</div><div class="v">'+esc(d.api_base || '')+'</div></div>' +
    '<div class="kv"><div class="k">运行模式</div><div class="v">'+esc(d.mode || '')+'</div></div>'
  document.getElementById('apiBase').value = d.api_base || ''
  document.getElementById('model').value = d.model && d.model !== '(未配置)' ? d.model : ''
}
async function loadLlmConfig(){
  try{
    const r=await fetch(apiPath('/api/config/llm'))
    const d=await r.json()
    renderConfig(d)
  }catch(e){
    document.getElementById('llmStatusArea').innerHTML='<span style="color:var(--red)">加载失败：'+esc(e.message)+'</span>'
  }
}
async function testLlmConnection(){
  const btn=document.getElementById('testBtn')
  btn.disabled=true
  showResult('testResult', true, '测试中...')
  try{
    const t0=performance.now()
    const r=await fetch(apiPath('/api/config/llm-test'))
    const d=await r.json()
    const ms=Math.round(performance.now()-t0)
    if(r.ok && d.ok){
      showResult('testResult', true, '连接正常 ('+ms+'ms)\n模型: '+(d.model || '-')+'\n响应: '+(d.test_response || '-'))
    }else{
      showResult('testResult', false, '连接失败 ('+ms+'ms)\n'+(d.message || JSON.stringify(d,null,2)))
    }
  }catch(e){
    showResult('testResult', false, '请求失败：'+e.message)
  }finally{
    btn.disabled=false
  }
}
async function saveLlmConfig(clearKey){
  const btn=document.getElementById('saveBtn')
  btn.disabled=true
  showResult('saveResult', true, '保存中...')
  try{
    const payload={
      api_base: document.getElementById('apiBase').value.trim(),
      model: document.getElementById('model').value.trim(),
      api_key: document.getElementById('apiKey').value.trim(),
      clear_api_key: !!clearKey
    }
    const r=await fetch(apiPath('/api/config/llm'),{
      method:'PUT',
      headers: roleHeaders(),
      body: JSON.stringify(payload)
    })
    const d=await r.json()
    if(!r.ok || !d.ok){
      showResult('saveResult', false, d.error || d.message || JSON.stringify(d,null,2))
      return
    }
    document.getElementById('apiKey').value=''
    renderConfig(d)
    showResult('saveResult', true, d.message + '\n当前 Key: ' + (d.api_key_masked || '未配置'))
  }catch(e){
    showResult('saveResult', false, '保存失败：'+e.message)
  }finally{
    btn.disabled=false
  }
}
function clearApiKey(){
  if(confirm('确认清空 API Key？清空后系统会降级到规则引擎。')){
    saveLlmConfig(true)
  }
}
loadLlmConfig()
</script>
</body>
</html>
