- id: sop_shipping_033
  intent: shipping
  scenario: '售后规则 '
  risk_level: high
  steps:
  - 货物途中运输客户反映不需要 应该及时告知快递拦截 并且告知客户快递可能拦截失败 避免担责
  - 快递在路上出现丢件 问题件 需要立即与物流核对并给到客户解决方案
  - 快递送货上门服务 货物属于大件货物 客户不送货上门可以和相对应的快递反馈 协商一下帮助客户送货上门 要是快递不送货上们 客户情绪也是比较激动 可以给到5-10元的协商补偿
    让客户自己拿一下 避免差评投诉 （小件货物可以让客户自己拿一下 不提补偿）
  - 简单咨询类：询问安装视频 安装图纸 货物没有问题的情况下在发送安装视频之后可以顺带发一下邀评话术
  - 安装类：客户不会安装 教安装 客户情绪稳定并且货物没有问题可以顺带发一下邀评话术
  required_checks: []
  required_customer_info: []
  forbidden_claims:
  - 货物问题类：轻微磕碰可以先提出给到客户一定补偿方案，不要上去就提到补发，客户不同意补偿方案在提到补发，补发不要也是可以给到小额补偿+补发方案
  - 货物问题破损严重类：客户收到货物看见损坏严重 一眼看出不能使用 进线咨询 客户情绪稳定可以直接提出补发 客户提出退货可以给出一定的补偿 客户进线情绪比较激动
    需要先安抚客户情绪在提出解决方案 补发+补偿 客户提出诉求尽量满足 要是客户要求比较高可以向上级反映看下能不能给到  涉及投诉差评问题尽量都满足客户
  - 客单价在十几元的 损坏严重的 不能使用的 退回也没有必要的 可以给到客户仅退款方案 顺带让客户给一个好评 这个可以走小额打款进行 订单备注清楚避免客户申请售后（仅退款需要给领导反馈
    也要和客户说好）
  - 超出七天无理由 看客户具体货物问题 确实有问题可以进行挽留 挽留不下来可以申请退货退款 货物没有问题就不要让客户退了但是客户情绪激动 提到差评投诉也是可以退的（需要客服进行挽留）
  - 在质保期货物出现问题要先核实客户使用情况 看下是否使用方法不对导致货物出现问题  没有的情况下配件问题 可以给客户补发  让客户更换使用  客户提出退货可以给到补发+补偿
    （滑梯质保一年 但是客户使用一个月后就要收补件配件邮费 配件不要钱 ）
  - 禁止承诺清单
  - 禁止一切非常肯定回复客户的要求或者问题 也不能肯定的回答客户提出的诉求
  escalation_triggers:
  - 客单价在十几元的 损坏严重的 不能使用的 退回也没有必要的 可以给到客户仅退款方案 顺带让客户给一个好评 这个可以走小额打款进行 订单备注清楚避免客户申请售后（仅退款需要给领导反馈
    也要和客户说好）
  - 货物超出质保期 需要客户提供商品损坏照片或者视频 客户要求补发的需要收客户配件费用+邮费 退货不支持 （客户情绪激动涉及投诉 工商投诉等可以和领导协商免费补发）
  suggested_reply_style: 谨慎处理
  source_file: 基础规则.docx
