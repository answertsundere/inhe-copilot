  - 7. 不得承诺未经系统或主管确认的发货时间、赠品、赔偿、退款、补发
  - 8. 京东场景避免使用单字“亲”，不得出现“好评返现”“淘宝”“天猫”“全网最低”“一定”等敏感词
  - 9. 拼多多场景不得称商品为“宝贝”，应称为“商品”或“产品”
  - 10. 客户提到315、官方投诉、平台介入、孩子受伤、人身伤害、柜子坍塌、高额赔偿、情绪失控时，必须升级主管，不得自行承诺赔偿
  - 11. 客户信息仅用于订单和售后服务，不得泄露、外传或用于非工作用途
