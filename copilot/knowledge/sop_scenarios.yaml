- id: sop_shipping_031
  intent: shipping
  scenario: 主要职责
  risk_level: medium
  steps:
  - 专业咨询与需求挖掘： 通过千牛、咚咚等在线工具热情接待客户。不局限于回答“发什么快递”，更要主动挖掘宝宝的月龄、体质（如是否过敏）及家庭场景，精准推荐合适的家具或者玩具等能用到的产品。
  - 关联销售与活动引导： 熟练掌握店铺满减、赠品及会员权益活动。在解答客户疑问时，巧妙进行关联推荐（如小型玩具推荐摇摇车等），提升客单价。
  - 订单核对与风险规避： 在客户下单后，第一时间核对收货地址、宝宝适用规格等关键信息。如遇客户要求修改地址或规格，需在后台准确备注并同步打单人员，避免发错货。
  - 竞品分析与话术优化： 收集客户对产品价格、功能的常见异议，提炼自家产品的差异化卖点（如收纳柜的材质等），并参与优化售前催单、破冰话术。
  required_checks: []
  required_customer_info: []
  forbidden_claims: []
  escalation_triggers: []
  suggested_reply_style: 诚恳安抚
  source_file: 基础规则.docx
