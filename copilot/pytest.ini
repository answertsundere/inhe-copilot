[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 默认超时安全网：任何单测超过 60s 即判失败并继续，避免单条卡死阻塞整个 run。
# 依赖 pytest-timeout（已加入 requirements.txt 测试段）。thread 法兼容 Windows。
addopts = -q --timeout=60 --timeout-method=thread
markers =
    integration: 调用真实外部服务的集成测试（LLM/聚水潭/钉钉/VLM），默认不随单测运行
